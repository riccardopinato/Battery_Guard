name: Build Battery Guard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battery-guard-android-main
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete generated Flutter Android files
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_scaffold
          flutter create             --platforms=android             --org com.riccardopinato             --project-name battery_guard             /tmp/battery_guard_scaffold

          cp /tmp/battery_guard_scaffold/android/gradlew android/gradlew
          cp /tmp/battery_guard_scaffold/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f .metadata ]; then
            cp /tmp/battery_guard_scaffold/.metadata .metadata
          fi
          chmod +x android/gradlew

      - name: Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk Battery-Guard-v0.1.0.apk
          sha256sum Battery-Guard-v0.1.0.apk | tee Battery-Guard-v0.1.0.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-v0.1.0
          path: |
            Battery-Guard-v0.1.0.apk
            Battery-Guard-v0.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0               Battery-Guard-v0.1.0.apk               Battery-Guard-v0.1.0.apk.sha256               --clobber
          else
            gh release create v0.1.0               Battery-Guard-v0.1.0.apk               Battery-Guard-v0.1.0.apk.sha256               --target "${GITHUB_SHA}"               --title "Battery Guard v0.1.0"               --notes "Prima build Android installabile di Battery Guard. APK release firmato con chiave di debug per test diretto."
          fi
