name: Battery Guard CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battery-guard-android-main
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Complete pinned Flutter Android wrapper
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_scaffold
          flutter create \
            --platforms=android \
            --org com.riccardopinato \
            --project-name battery_guard \
            /tmp/battery_guard_scaffold
          cp /tmp/battery_guard_scaffold/android/gradlew android/gradlew
          cp /tmp/battery_guard_scaffold/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f .metadata ]; then
            cp /tmp/battery_guard_scaffold/.metadata .metadata
          fi
          chmod +x android/gradlew

      - name: Prepare optional production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/battery-guard-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/battery-guard-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "PRODUCTION_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "PRODUCTION_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web Preview
        run: flutter build web --release --base-href /Battery_Guard/

      - name: Deploy Web Preview branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_pages
          mkdir -p /tmp/battery_guard_pages
          cp -R build/web/. /tmp/battery_guard_pages/
          cd /tmp/battery_guard_pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Battery Guard Web Preview ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Build split APKs
        run: |
          rm -rf build/symbols
          mkdir -p build/symbols
          flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Build universal APK
        run: flutter build apk --release --split-debug-info=build/symbols

      - name: Build AAB
        run: flutter build appbundle --release --split-debug-info=build/symbols

      - name: Prepare immutable CI bundle
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/Battery-Guard-${VERSION}-${SHORT_SHA}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/Battery-Guard-${VERSION}-${SHORT_SHA}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release/Battery-Guard-${VERSION}-${SHORT_SHA}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release/Battery-Guard-${VERSION}-${SHORT_SHA}-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/Battery-Guard-${VERSION}-${SHORT_SHA}.aab"
          (
            cd release
            sha256sum * > SHA256SUMS.txt
          )
          {
            echo "version=$VERSION"
            echo "sourceSha=$GITHUB_SHA"
            echo "productionSigningReady=$PRODUCTION_SIGNING_READY"
            echo "flutter=3.47.5"
            echo "webPreviewBranch=gh-pages"
            echo "admob=test-ids-in-ci"
            echo "proProduct=battery_guard_pro_lifetime"
          } > release/BUILD_EVIDENCE.txt

      - name: Upload immutable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-${{ github.sha }}
          path: |
            release/*
            build/symbols/**
          if-no-files-found: error
          retention-days: 7
