name: Battery Guard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battery-guard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Complete pinned Flutter Android wrapper
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_scaffold
          flutter create \
            --platforms=android \
            --org com.riccardopinato \
            --project-name battery_guard \
            /tmp/battery_guard_scaffold
          cp /tmp/battery_guard_scaffold/android/gradlew android/gradlew
          cp /tmp/battery_guard_scaffold/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f .metadata ]; then
            cp /tmp/battery_guard_scaffold/.metadata .metadata
          fi
          chmod +x android/gradlew

      - name: Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Web Preview
        run: flutter build web --release --base-href /Battery_Guard/

      - name: Upload Web Preview
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-web-${{ github.sha }}
          path: build/web/**
          if-no-files-found: error
          retention-days: 2

      - name: Compile ARM64 debug on PR
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-lock-${{ github.sha }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3

      - name: Require persistent INTERNAL signing
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: "CB:6C:7D:05:C3:43:0F:34:31:F3:22:82:48:E2:14:C6:4B:0B:50:EA:E1:6D:8C:D1:0F:63:5C:32:AF:3D:E2:91"
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/battery-guard-internal.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          ACTUAL_CERT_SHA256="$(
            keytool -list -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1
          )"

          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_LANE=internal" >> "$GITHUB_ENV"
          echo "SIGNING_CERT_SHA256=$ACTUAL_CERT_SHA256" >> "$GITHUB_ENV"

      - name: Build FREE ARM64 APK and AAB
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/symbols-free /tmp/battery_guard_free
          mkdir -p build/symbols-free /tmp/battery_guard_free

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --split-debug-info=build/symbols-free \
            --dart-define=BATTERY_GUARD_ALLOW_LOCAL_PRO_TEST=true

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            /tmp/battery_guard_free/app-arm64-v8a-release.apk

          flutter build appbundle \
            --release \
            --split-debug-info=build/symbols-free

          cp build/app/outputs/bundle/release/app-release.aab \
            /tmp/battery_guard_free/app-release.aab

      - name: Build PREMIUM TEST ARM64 APK
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/symbols-premium
          mkdir -p build/symbols-premium

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --split-debug-info=build/symbols-premium \
            --dart-define=BATTERY_GUARD_FORCE_PRO_TEST=true

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            /tmp/battery_guard_premium-arm64-v8a-release.apk

      - name: Prepare and verify INTERNAL bundle
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_META="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION="$(printf '%s' "$VERSION_META" | cut -d+ -f1)"
          VERSION_CODE="$(printf '%s' "$VERSION_META" | cut -d+ -f2)"
          SHORT_SHA="${GITHUB_SHA:0:12}"

          rm -rf release
          mkdir -p release/symbols-free release/symbols-premium

          FREE_APK="release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE-arm64-v8a.apk"
          PREMIUM_APK="release/Battery-Guard-${VERSION}-${SHORT_SHA}-PREMIUM-TEST-arm64-v8a.apk"
          FREE_AAB="release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE.aab"

          cp /tmp/battery_guard_free/app-arm64-v8a-release.apk "$FREE_APK"
          cp /tmp/battery_guard_premium-arm64-v8a-release.apk "$PREMIUM_APK"
          cp /tmp/battery_guard_free/app-release.aab "$FREE_AAB"
          cp pubspec.lock release/pubspec.lock
          cp -R build/symbols-free/. release/symbols-free/
          cp -R build/symbols-premium/. release/symbols-premium/

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          EXPECTED_DIGEST="$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          for APK in "$FREE_APK" "$PREMIUM_APK"; do
            VERIFY_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
            ACTUAL_DIGEST="$(
              printf '%s\n' "$VERIFY_OUTPUT" |
              sed -n 's/^.*certificate SHA-256 digest: //p' |
              head -n 1 |
              tr '[:lower:]' '[:upper:]'
            )"
            test -n "$ACTUAL_DIGEST"
            test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          done

          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKANALYZER"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$FREE_APK")"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$FREE_APK")"
          test "$PACKAGE_ID" = "com.riccardopinato.batteryguard"

          {
            echo "version=$VERSION"
            echo "versionCode=$VERSION_CODE"
            echo "packageId=$PACKAGE_ID"
            echo "targetSdk=$TARGET_SDK"
            echo "sourceSha=$GITHUB_SHA"
            echo "flutter=3.47.5"
            echo "signingLane=$SIGNING_LANE"
            echo "signingCertSha256=$SIGNING_CERT_SHA256"
            echo "admobFree=test-ids"
            echo "internalFreeLocalProUnlock=true"
            echo "freeAabLocalProUnlock=false"
            echo "premiumTestOverride=true"
            echo "premiumTestAds=disabled-by-pro-entitlement"
            echo "proProduct=battery_guard_pro_lifetime"
            echo "artifactPolicy=arm64-first"
            echo "intelligenceFoundation=true"
            echo "curveMaxPoints=120"
            echo "freeDataProvenance=true"
            echo "freeCapabilityMap=true"
            echo "freeSessionReasons=true"
            echo "freeOemLimitDetection=true"
            echo "premiumChargingCurve=true"
            echo "chargingIntelligence=true"
            echo "freeChargeDoctorBasic=true"
            echo "freeChargingSetupLimit=1"
            echo "freeQualitativeScores=true"
            echo "freeBatteryStressSummary=true"
            echo "premiumMultipleSetups=true"
            echo "premiumDetailedChargeScores=true"
            echo "premiumChargerRanking=true"
            echo "premiumBatteryStressDetails=true"
            echo "personalBaselineScope=profileId"
            echo "batteryStressModel=exposure-heuristic-v1"
            echo "chargeProtectionTransitionRequired=true"
            echo "directControlRequiresCommandReadback=true"
            echo "staticStoppedSnapshotCanVerify=false"
          } > release/BUILD_EVIDENCE.txt

          (
            cd release
            find . -type f ! -name SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload INTERNAL evidence bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-INTERNAL-${{ github.sha }}
          path: release/**
          if-no-files-found: error
          retention-days: 7


  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Web Preview
        uses: actions/download-artifact@v4
        with:
          name: Battery-Guard-web-${{ github.sha }}
          path: web-preview

      - name: Deploy Web Preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          cd web-preview
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Battery Guard Web Preview ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
