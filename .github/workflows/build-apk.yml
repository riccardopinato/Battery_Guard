name: Build Battery Guard Lightweight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battery-guard-android-main
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete generated Flutter Android files
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_scaffold
          flutter create \
            --platforms=android \
            --org com.riccardopinato \
            --project-name battery_guard \
            /tmp/battery_guard_scaffold

          cp /tmp/battery_guard_scaffold/android/gradlew android/gradlew
          cp /tmp/battery_guard_scaffold/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f .metadata ]; then
            cp /tmp/battery_guard_scaffold/.metadata .metadata
          fi
          chmod +x android/gradlew

      - name: Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build lightweight APKs
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/symbols
          mkdir -p build/symbols
          flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Build universal APK
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --release --split-debug-info=build/symbols

      - name: Build Play Store AAB
        shell: bash
        run: |
          set -euxo pipefail
          flutter build appbundle --release --split-debug-info=build/symbols

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release

          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/Battery-Guard-v0.3.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/Battery-Guard-v0.3.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/Battery-Guard-v0.3.0-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release/Battery-Guard-v0.3.0-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab release/Battery-Guard-v0.3.0.aab

          (
            cd release
            sha256sum Battery-Guard-v0.3.0-arm64-v8a.apk \
                      Battery-Guard-v0.3.0-armeabi-v7a.apk \
                      Battery-Guard-v0.3.0-x86_64.apk \
                      Battery-Guard-v0.3.0-universal.apk \
                      Battery-Guard-v0.3.0.aab > SHA256SUMS.txt
          )

          {
            echo "Battery Guard v0.3.0 - dimensioni build"
            echo
            du -h release/Battery-Guard-v0.3.0-arm64-v8a.apk
            du -h release/Battery-Guard-v0.3.0-armeabi-v7a.apk
            du -h release/Battery-Guard-v0.3.0-x86_64.apk
            du -h release/Battery-Guard-v0.3.0-universal.apk
            du -h release/Battery-Guard-v0.3.0.aab
          } | tee release/SIZES.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-v0.3.0-Quick-Controls
          path: |
            release/*
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 \
              release/Battery-Guard-v0.3.0-arm64-v8a.apk \
              release/Battery-Guard-v0.3.0-armeabi-v7a.apk \
              release/Battery-Guard-v0.3.0-x86_64.apk \
              release/Battery-Guard-v0.3.0-universal.apk \
              release/Battery-Guard-v0.3.0.aab \
              release/SHA256SUMS.txt \
              release/SIZES.txt \
              --clobber
          else
            gh release create v0.3.0 \
              release/Battery-Guard-v0.3.0-arm64-v8a.apk \
              release/Battery-Guard-v0.3.0-armeabi-v7a.apk \
              release/Battery-Guard-v0.3.0-x86_64.apk \
              release/Battery-Guard-v0.3.0-universal.apk \
              release/Battery-Guard-v0.3.0.aab \
              release/SHA256SUMS.txt \
              release/SIZES.txt \
              --target "${GITHUB_SHA}" \
              --title "Battery Guard v0.3.0 Quick Controls" \
              --notes "Quick Controls: Tile Android nei Quick Settings per attivare/disattivare Battery Guard, widget Home con livello e temperatura, toggle protezione, cambio rapido target 80/85/90/100 e refresh. Nessuna nuova dipendenza."
          fi
