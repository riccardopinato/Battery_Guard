name: Battery Guard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battery-guard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Complete pinned Flutter Android wrapper
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_scaffold
          flutter create \
            --platforms=android \
            --org com.riccardopinato \
            --project-name battery_guard \
            /tmp/battery_guard_scaffold
          cp /tmp/battery_guard_scaffold/android/gradlew android/gradlew
          cp /tmp/battery_guard_scaffold/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/battery_guard_scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f .metadata ]; then
            cp /tmp/battery_guard_scaffold/.metadata .metadata
          fi
          chmod +x android/gradlew

      - name: Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web Preview
        run: flutter build web --release --base-href /Battery_Guard/

      - name: Build Android debug smoke for untrusted PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: flutter build apk --debug

      - name: Deploy Web Preview branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/battery_guard_pages
          mkdir -p /tmp/battery_guard_pages
          cp -R build/web/. /tmp/battery_guard_pages/
          cd /tmp/battery_guard_pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Battery Guard Web Preview ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Require persistent INTERNAL signing
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: "CB:6C:7D:05:C3:43:0F:34:31:F3:22:82:48:E2:14:C6:4B:0B:50:EA:E1:6D:8C:D1:0F:63:5C:32:AF:3D:E2:91"
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/battery-guard-internal.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          ACTUAL_CERT_SHA256="$(
            keytool -list -v               -keystore "$KEYSTORE_PATH"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1
          )"

          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_LANE=internal" >> "$GITHUB_ENV"
          echo "SIGNING_CERT_SHA256=$ACTUAL_CERT_SHA256" >> "$GITHUB_ENV"

      - name: Build FREE APKs and AAB
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/symbols-free /tmp/battery_guard_free /tmp/battery_guard_free_symbols
          mkdir -p build/symbols-free /tmp/battery_guard_free /tmp/battery_guard_free_symbols

          flutter build apk --release --split-per-abi --split-debug-info=build/symbols-free
          flutter build apk --release --split-debug-info=build/symbols-free
          flutter build appbundle --release --split-debug-info=build/symbols-free

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/battery_guard_free/app-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk /tmp/battery_guard_free/app-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk /tmp/battery_guard_free/app-x86_64-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/battery_guard_free/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab /tmp/battery_guard_free/app-release.aab
          cp -R build/symbols-free/. /tmp/battery_guard_free_symbols/

      - name: Build PREMIUM TEST APKs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          flutter gen-l10n
          rm -rf build/symbols-premium
          mkdir -p build/symbols-premium

          flutter build apk             --release             --split-per-abi             --split-debug-info=build/symbols-premium             --dart-define=BATTERY_GUARD_FORCE_PRO_TEST=true

          flutter build apk             --release             --split-debug-info=build/symbols-premium             --dart-define=BATTERY_GUARD_FORCE_PRO_TEST=true

      - name: Prepare and verify immutable INTERNAL bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_META="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION="$(printf '%s' "$VERSION_META" | cut -d+ -f1)"
          VERSION_CODE="$(printf '%s' "$VERSION_META" | cut -d+ -f2)"
          SHORT_SHA="${GITHUB_SHA:0:12}"

          rm -rf release
          mkdir -p release/symbols-free release/symbols-premium

          cp /tmp/battery_guard_free/app-arm64-v8a-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE-arm64-v8a.apk"
          cp /tmp/battery_guard_free/app-armeabi-v7a-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE-armeabi-v7a.apk"
          cp /tmp/battery_guard_free/app-x86_64-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE-x86_64.apk"
          cp /tmp/battery_guard_free/app-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE-universal.apk"
          cp /tmp/battery_guard_free/app-release.aab             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-FREE.aab"

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-PREMIUM-TEST-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-PREMIUM-TEST-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-PREMIUM-TEST-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "release/Battery-Guard-${VERSION}-${SHORT_SHA}-PREMIUM-TEST-universal.apk"

          cp -R /tmp/battery_guard_free_symbols/. release/symbols-free/
          cp -R build/symbols-premium/. release/symbols-premium/
          cp pubspec.lock release/pubspec.lock

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          EXPECTED_DIGEST="$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          for APK in release/*.apk; do
            VERIFY_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
            ACTUAL_DIGEST="$(
              printf '%s\n' "$VERIFY_OUTPUT" |
              sed -n 's/^.*certificate SHA-256 digest: //p' |
              head -n 1 |
              tr '[:lower:]' '[:upper:]'
            )"
            test -n "$ACTUAL_DIGEST"
            test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          done

          {
            echo "version=$VERSION"
            echo "versionCode=$VERSION_CODE"
            echo "packageId=com.riccardopinato.batteryguard"
            echo "sourceSha=$GITHUB_SHA"
            echo "flutter=3.47.5"
            echo "signingLane=$SIGNING_LANE"
            echo "signingCertSha256=$SIGNING_CERT_SHA256"
            echo "admobFree=test-ids"
            echo "premiumTestOverride=true"
            echo "premiumTestAds=disabled-by-pro-entitlement"
            echo "proProduct=battery_guard_pro_lifetime"
            echo "launcherIcon=refined-shield-battery-v1"
          } > release/BUILD_EVIDENCE.txt

          (
            cd release
            find . -type f ! -name SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload immutable INTERNAL artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Guard-INTERNAL-${{ github.sha }}
          path: release/**
          if-no-files-found: error
          retention-days: 7
